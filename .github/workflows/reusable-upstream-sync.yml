name: Reusable Upstream Sync Workflow

on:
  workflow_call:
    inputs:
      upstream_url:
        required: true
        type: string
        description: 'URL of the upstream original repository'
      node_version:
        required: false
        type: string
        default: '20'

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Check for Upstream Updates
        id: check_upstream
        run: |
          git remote add upstream ${{ inputs.upstream_url }} || true
          git fetch upstream
          UPSTREAM_HEAD=$(git rev-parse upstream/HEAD || git rev-parse upstream/master || git rev-parse upstream/main)
          MERGE_BASE=$(git merge-base HEAD $UPSTREAM_HEAD)
          
          if [ "$UPSTREAM_HEAD" = "$MERGE_BASE" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "Upstream is up to date."
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "New updates found in upstream!"
          fi

      - name: Install dependencies
        if: steps.check_upstream.outputs.has_updates == 'true'
        run: npm ci || npm install

      - name: Run i18n validator
        if: steps.check_upstream.outputs.has_updates == 'true'
        run: |
          if npm run | grep -q "check-i18n"; then
            npm run check-i18n
          fi

      - name: Run build and tests
        if: steps.check_upstream.outputs.has_updates == 'true'
        run: |
          npm run build
          if npm run | grep -q "test"; then
            npm test
          fi
